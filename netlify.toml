# Netlify configuration for Permit SDR Dashboard
# The dashboard is in the /dashboard subdirectory

[build]
  base = "dashboard"
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
