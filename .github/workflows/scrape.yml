name: Scrape Permits

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST) for previous day's permits
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to scrape (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - howard_county_md
          - baltimore_county_md
          - baltimore_city_md
          - anne_arundel_county_md
          - dc
      run_scoring:
        description: 'Run AI scoring after scraping'
        required: false
        type: boolean
        default: true
      start_date:
        description: 'Start date for permit search (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: 'End date for permit search (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.jurisdiction }}" ]; then
            ARGS="$ARGS --jurisdiction=${{ github.event.inputs.jurisdiction }}"
          fi
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            ARGS="$ARGS --start-date=${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --end-date=${{ github.event.inputs.end_date }}"
          fi
          npx tsx src/index.ts $ARGS

      - name: Run AI scoring
        if: ${{ github.event.inputs.run_scoring != 'false' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx src/index.ts --score-only
