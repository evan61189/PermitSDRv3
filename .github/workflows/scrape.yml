name: Scrape Permits

on:
  schedule:
    # Run every 3 days at 6 AM UTC (1 AM EST)
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to scrape (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - howard_county_md
          - baltimore_county_md
          - baltimore_city_md
          - anne_arundel_county_md
          - dc
      run_scoring:
        description: 'Run AI scoring after scraping'
        required: false
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.jurisdiction }}" ]; then
            npx tsx src/index.ts --jurisdiction=${{ github.event.inputs.jurisdiction }}
          else
            npx tsx src/index.ts
          fi

      - name: Run AI scoring
        if: ${{ github.event.inputs.run_scoring != 'false' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx src/index.ts --score-only
