name: Scrape New Counties (Carroll & Frederick)

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST) for previous day's permits
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to scrape (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - 'carroll_county_md'
          - 'frederick_county_md'
      start_date:
        description: 'Start date (YYYY-MM-DD format, e.g., 2025-01-01)'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD format, e.g., 2025-01-31)'
        required: false
        type: string

jobs:
  scrape-new-counties:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run new counties scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CMD="npx tsx src/index-new-counties.ts"

          if [ -n "${{ inputs.jurisdiction }}" ]; then
            CMD="$CMD --jurisdiction=${{ inputs.jurisdiction }}"
          fi

          if [ -n "${{ inputs.start_date }}" ] && [ -n "${{ inputs.end_date }}" ]; then
            echo "Running with custom date range: ${{ inputs.start_date }} to ${{ inputs.end_date }}"
            CMD="$CMD --start-date=${{ inputs.start_date }} --end-date=${{ inputs.end_date }}"
          else
            echo "Running with default date range (last 30 days)"
          fi

          echo "Executing: $CMD"
          eval $CMD
