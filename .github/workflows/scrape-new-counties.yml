name: Scrape Carroll County

on:
  # Separate schedule from existing scrapers - runs on different days
  schedule:
    # Run every 3 days at 8 AM UTC (3 AM EST) - offset from main scraper
    - cron: '0 8 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch:

jobs:
  scrape-carroll-county:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run Carroll County scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx src/index-new-counties.ts
