name: Remove Duplicate Permits

on:
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to clean (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'frederick_county_md'
          - 'carroll_county_md'
          - 'howard_county_md'
          - 'baltimore_city_md'
          - 'anne_arundel_county_md'
      dry_run:
        description: 'Dry run (preview only, no deletions)'
        required: true
        default: true
        type: boolean

jobs:
  remove-duplicates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scraper
        run: npm ci

      - name: Run duplicate removal script
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.jurisdiction }}" ]; then
            ARGS="$ARGS --jurisdiction=${{ inputs.jurisdiction }}"
          fi
          echo "Running: npx tsx src/scripts/remove-duplicates.ts $ARGS"
          npx tsx src/scripts/remove-duplicates.ts $ARGS
